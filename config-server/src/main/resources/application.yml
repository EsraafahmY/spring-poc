server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native            # read config from the classpath / filesystem (switch to "git" in real projects)
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/config-repo}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
